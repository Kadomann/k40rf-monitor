# Baut die App für Windows und Android.
# Testlauf: GitHub → Actions → "Build" → "Run workflow"; Ergebnis unter "Artifacts".
# Release: GitHub → Releases → "Draft a new release" mit Tag wie v0.2.0 → "Publish".
#          Der Workflow baut dann und hängt Installer und APK an das Release an.
name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Versionsnummer aus dem Release übernehmen (v0.2.0 → 0.2.0)
        if: github.event_name == 'release'
        shell: bash
        run: echo "TAURI_CONFIG={\"version\":\"${GITHUB_REF_NAME#v}\"}" >> "$GITHUB_ENV"
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: k40-monitor-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;${NDK_VERSION}" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Versionsnummer aus dem Release übernehmen (v0.2.0 → 0.2.0)
        if: github.event_name == 'release'
        shell: bash
        run: echo "TAURI_CONFIG={\"version\":\"${GITHUB_REF_NAME#v}\"}" >> "$GITHUB_ENV"
      - name: Android-Projekt erzeugen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon app-icon.png
      - name: APK bauen (Release, optimiert)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64
      - name: APK signieren
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORD fehlen (siehe README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/k40.jks"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/k40.jks" --ks-key-alias k40monitor \
            --ks-pass env:KEYSTORE_PASSWORD --out dist/k40-monitor.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify dist/k40-monitor.apk
          ls -lh dist/k40-monitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: k40-monitor-android
          path: dist/k40-monitor.apk

  release:
    if: github.event_name == 'release'
    needs: [windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Dateien an das Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            $(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.apk' \))
